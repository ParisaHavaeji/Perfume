<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <!-- No maximum-scale here on purpose: pinch-zoom matters when squinting at a shelf.
       list.js adds the cap on iOS only, where it kills the input-focus auto-zoom
       without blocking pinch; on Android it would block pinch, so it stays off. -->
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Smell List</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="topbar"><span><a href="/">SMELL&nbsp;LIST</a></span></header>
  <main>
    <div class="wide list-page" id="page">
      <section class="list-controls">
        <div class="finder-row">
          <p class="countline" id="count"></p>
          <div class="finder-field">
            <label class="finder-label" for="search-location">Location</label>
            <div class="ta-anchor">
              <div class="search-box">
                <input id="search-location" type="search" placeholder="Anywhere" autocomplete="off" />
              </div>
              <div class="results ta-results" id="ta-location" hidden></div>
            </div>
            <div class="filter-chips" id="chips-location"></div>
          </div>
          <div class="finder-field">
            <label class="finder-label" for="search-want">I like</label>
            <div class="ta-anchor">
              <div class="search-box">
                <input id="search-want" type="search" placeholder="Vanilla, oud, Le Labo…" autocomplete="off" />
              </div>
              <div class="results ta-results" id="ta-want" hidden></div>
            </div>
            <div class="filter-chips" id="chips-want"></div>
          </div>
          <div class="finder-field">
            <label class="finder-label" for="search-avoid">I avoid</label>
            <div class="ta-anchor">
              <div class="search-box">
                <input id="search-avoid" type="search" placeholder="Sweet, aquatic, Dior…" autocomplete="off" />
              </div>
              <div class="results ta-results" id="ta-avoid" hidden></div>
            </div>
            <div class="filter-chips" id="chips-avoid"></div>
          </div>
        </div>
      </section>
      <p class="banner" id="banner" hidden>Cached results</p>
      <div id="surprise-slot"></div>
      <div class="cards" id="cards"></div>
      <div class="empty" id="empty" hidden></div>
      <div class="more-row">
        <button class="btn" id="more" type="button" hidden>More</button>
        <button class="ghost" id="surprise" type="button" disabled>Surprise me</button>
      </div>
    </div>
  </main>
  <div class="toast" id="toast" role="status"></div>
  <script src="/common.js"></script>
  <script src="/list.js"></script>
</body>
</html>
