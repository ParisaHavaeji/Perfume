<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>Smell Things</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="topbar"><span>SMELL&nbsp;THINGS</span></header>
  <main>
    <div class="narrow join">
      <h1 class="title">You smell things. You guess what's in them.</h1>
      <div class="cta chooser">
        <div>
          <button class="btn block" id="create" type="button">Start a game</button>
          <p class="sub">Queue perfumes, friends guess the notes</p>
        </div>
        <div>
          <a class="btn block" href="/list">Smell list</a>
          <p class="sub">What to go sniff, in the store</p>
        </div>
      </div>
    </div>
  </main>
  <div class="toast" id="toast" role="status"></div>
  <script src="/common.js"></script>
  <script>
    const button = document.getElementById('create');
    button.addEventListener('click', () => createGameAndGo(button));
  </script>
</body>
</html>
