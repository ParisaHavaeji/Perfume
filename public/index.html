<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>Smell Things</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="topbar"><span>SMELL&nbsp;THINGS</span></header>
  <main>
    <div class="narrow join">
      <p class="eyebrow">New game</p>
      <h1 class="title">You smell things. You guess what's in them.</h1>
      <div class="cta">
        <button class="btn block" id="create" type="button">Create game</button>
      </div>
    </div>
  </main>
  <div class="toast" id="toast" role="status"></div>
  <script src="/common.js"></script>
  <script>
    const button = document.getElementById('create');
    button.addEventListener('click', () => createGameAndGo(button));
  </script>
</body>
</html>
