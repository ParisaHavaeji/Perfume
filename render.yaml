services:
  - type: web
    # Stays nose-game on purpose: renaming here makes Render create a NEW
    # service instead of renaming this one.
    name: nose-game
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /
    # Kept from the removed live-add feature: the file is retained as a
    # schema anchor and pushes touching only it need not redeploy.
    buildFilter:
      ignoredPaths:
        - data/raw/parfumo_new.jsonl
    envVars:
      - key: NODE_VERSION
        value: 22
